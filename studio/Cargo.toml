[package]
name = "theme-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-width = "0.2"
vt100 = "0.18.1"

# Clippy groups for this project (docs/refactor/PRINCIPLES.md, project rule 3).
# style and correctness are on by default. pedantic is added here, so a plain
# `cargo clippy` checks all three. priority = -1 lets a single lint override it.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
